---
# talento-appservice-state.yml
#
# DIAGNOSTICO (no invasivo) — reporta estado de los Azure App Service del RG.
#
# Para cada App Service muestra:
#   - state (Running/Stopped/StoppedAt...), enabled, defaultHostName, kind
#   - resourceGroup, location, SKU/tier (via plan)
#   - lastModifiedTimeUtc, hostNames
#
# Set_stats:
#   appservice_count, appservice_summary, appservice_severity

- name: TALENTO App Service state — diagnostico no invasivo
  hosts: localhost
  gather_facts: false

  vars:
    tenant_id: "{{ azure_tenant_id | default(lookup('env', 'AZURE_TENANT_ID')) }}"
    client_id: "{{ azure_client_id | default(lookup('env', 'AZURE_CLIENT_ID')) }}"
    client_secret: "{{ azure_client_secret | default(lookup('env', 'AZURE_CLIENT_SECRET')) }}"
    subscription_id: "{{ azure_subscription_id | default(lookup('env', 'AZURE_SUBSCRIPTION_ID')) }}"
    resource_group: "{{ azure_resource_group | mandatory }}"

  tasks:
    - name: Validar vars Azure
      ansible.builtin.assert:
        that:
          - tenant_id | length > 0
          - client_id | length > 0
          - client_secret | length > 0
          - subscription_id | length > 0
        fail_msg: "Faltan vars azure_*"

    - name: Obtener token OAuth2 (Azure ARM)
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ tenant_id }}/oauth2/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ client_id }}"
          client_secret: "{{ client_secret }}"
          resource: "https://management.azure.com/"
        status_code: 200
        timeout: 30
      register: token_response
      no_log: true

    - name: Guardar token
      ansible.builtin.set_fact:
        arm_token: "{{ token_response.json.access_token }}"
      no_log: true

    - name: Listar App Services del RG
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.Web/sites?api-version=2023-12-01"
        method: GET
        headers:
          Authorization: "Bearer {{ arm_token }}"
        status_code: 200
        timeout: 30
      register: web_list

    - name: Procesar estado por App Service
      ansible.builtin.set_fact:
        appservice_summary: >-
          {{ appservice_summary | default([]) + [{
            'name': item.name,
            'state': item.properties.state,
            'enabled': item.properties.enabled,
            'defaultHostName': item.properties.defaultHostName,
            'kind': item.kind,
            'location': item.location,
            'lastModifiedTimeUtc': item.properties.lastModifiedTimeUtc,
            'hostNamesDisabled': item.properties.hostNamesDisabled,
            'usageState': item.properties.usageState,
            'availabilityState': item.properties.availabilityState
          }] }}
      loop: "{{ web_list.json.value }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Clasificar severidad
      ansible.builtin.set_fact:
        stopped: "{{ appservice_summary | default([]) | selectattr('state', 'in', ['Stopped', 'StoppedFunctions']) | list }}"
        disabled: "{{ appservice_summary | default([]) | selectattr('enabled', 'equalto', false) | list }}"
        not_normal_availability: "{{ appservice_summary | default([]) | selectattr('availabilityState', 'ne', 'Normal') | list }}"

    - name: Determinar appservice_severity
      ansible.builtin.set_fact:
        appservice_severity: "{{ 'CRITICAL' if (stopped | length > 0 or disabled | length > 0) else ('DEGRADED' if not_normal_availability | length > 0 else 'HEALTHY') }}"

    - name: Exportar via set_stats
      ansible.builtin.set_stats:
        data:
          appservice_count: "{{ appservice_summary | default([]) | length }}"
          appservice_summary: "{{ appservice_summary | default([]) }}"
          appservice_severity: "{{ appservice_severity }}"
          appservice_stopped_count: "{{ stopped | length }}"
          appservice_disabled_count: "{{ disabled | length }}"
          resource_group: "{{ resource_group }}"
        per_host: false

    - name: Resumen stdout
      ansible.builtin.debug:
        msg:
          - "=== APP SERVICE STATE — {{ resource_group }} ==="
          - "App Services: {{ appservice_summary | default([]) | length }}"
          - "Severidad: {{ appservice_severity }}"
          - "Stopped: {{ stopped | length }} | Disabled: {{ disabled | length }} | Availability degradada: {{ not_normal_availability | length }}"
          - "Detalle:"
          - "{{ appservice_summary | default([]) }}"
