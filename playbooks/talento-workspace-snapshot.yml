---
# talento-workspace-snapshot.yml
#
# Snapshot diagnostico NO INVASIVO del workspace de Log Analytics de TALENTO.
# Disenado para ser invocado desde el agente de Foundry como una accion
# de "recuperar contexto operativo" auditada via AWX.
#
# Parametros (extra_vars):
#   time_range_hours: rango de horas a inspeccionar (default 24)
#   azure_tenant_id, azure_client_id, azure_client_secret, log_analytics_workspace_id:
#     credenciales inyectadas por el bridge si el playbook se ejecuta en AWX.
#     Si no se pasan, fallback a env vars (uso local).
#
# Salida:
#   - set_stats: snapshot_timestamp, time_range_hours, n_tables_with_data,
#                top_table_name, top_table_rows, schema_cols, sample_count
#   - debug: resumen humano-legible al final de stdout

- name: Talento workspace snapshot — diagnostico no invasivo
  hosts: localhost
  gather_facts: false

  vars:
    time_range_hours: "{{ time_range_hours | default(24) }}"
    tenant_id: "{{ azure_tenant_id | default(lookup('env', 'AZURE_TENANT_ID')) }}"
    client_id: "{{ azure_client_id | default(lookup('env', 'AZURE_CLIENT_ID')) }}"
    client_secret: "{{ azure_client_secret | default(lookup('env', 'AZURE_CLIENT_SECRET')) }}"
    workspace_id: "{{ log_analytics_workspace_id | default(lookup('env', 'LOG_ANALYTICS_WORKSPACE_ID')) }}"
    teams_webhook_url: "{{ teams_webhook_url | default(lookup('env', 'TEAMS_WEBHOOK_URL')) }}"

  tasks:
    - name: Validar variables requeridas
      ansible.builtin.assert:
        that:
          - tenant_id | length > 0
          - client_id | length > 0
          - client_secret | length > 0
          - workspace_id | length > 0
        fail_msg: "Faltan variables (azure_*) — pasalas como extra_vars o env."

    - name: Obtener token OAuth2 para Log Analytics
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ tenant_id }}/oauth2/token"
        method: POST
        headers:
          Content-Type: "application/x-www-form-urlencoded"
        body_format: form-urlencoded
        body:
          grant_type: "client_credentials"
          client_id: "{{ client_id }}"
          client_secret: "{{ client_secret }}"
          resource: "https://api.loganalytics.io"
        return_content: true
        status_code: 200
        timeout: 30
      register: token_response
      no_log: true

    - name: Guardar access token
      ansible.builtin.set_fact:
        la_token: "{{ token_response.json.access_token }}"
      no_log: true

    - name: Descubrir tablas pobladas en el rango {{ time_range_hours }}h
      ansible.builtin.uri:
        url: "https://api.loganalytics.azure.com/v1/workspaces/{{ workspace_id }}/query"
        method: POST
        headers:
          Authorization: "Bearer {{ la_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          query: |
            union withsource=Tabla *
            | where TimeGenerated > ago({{ time_range_hours }}h)
            | summarize Registros=count() by Tabla
            | order by Registros desc
        return_content: true
        status_code: 200
        timeout: 60
      register: tables_query

    - name: Extraer info de la tabla con mas datos
      ansible.builtin.set_fact:
        n_tables_with_data: "{{ tables_query.json.tables[0].rows | length }}"
        top_table_name: "{{ (tables_query.json.tables[0].rows | first | default(['none', 0]))[0] }}"
        top_table_rows: "{{ (tables_query.json.tables[0].rows | first | default(['none', 0]))[1] }}"
        all_tables_summary: "{{ tables_query.json.tables[0].rows | default([]) }}"

    - name: Obtener esquema de la tabla mas poblada
      ansible.builtin.uri:
        url: "https://api.loganalytics.azure.com/v1/workspaces/{{ workspace_id }}/query"
        method: POST
        headers:
          Authorization: "Bearer {{ la_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          query: "{{ top_table_name }} | getschema"
        return_content: true
        status_code: 200
        timeout: 60
      register: schema_response
      when: top_table_name != 'none'

    - name: Obtener muestra de la tabla mas poblada
      ansible.builtin.uri:
        url: "https://api.loganalytics.azure.com/v1/workspaces/{{ workspace_id }}/query"
        method: POST
        headers:
          Authorization: "Bearer {{ la_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          query: "{{ top_table_name }} | where TimeGenerated > ago({{ time_range_hours }}h) | take 10"
        return_content: true
        status_code: 200
        timeout: 60
      register: sample_response
      when: top_table_name != 'none'

    - name: Exportar resultados via set_stats
      ansible.builtin.set_stats:
        data:
          time_range_hours: "{{ time_range_hours }}"
          n_tables_with_data: "{{ n_tables_with_data }}"
          top_table_name: "{{ top_table_name }}"
          top_table_rows: "{{ top_table_rows }}"
          all_tables_summary: "{{ all_tables_summary }}"
          schema_cols: "{{ schema_response.json.tables[0].rows | default([]) | length }}"
          sample_count: "{{ sample_response.json.tables[0].rows | default([]) | length }}"
        per_host: false

    - name: Resumen humano-legible en stdout
      ansible.builtin.debug:
        msg:
          - "=== TALENTO WORKSPACE SNAPSHOT ==="
          - "Rango: {{ time_range_hours }} horas"
          - "Tablas pobladas: {{ n_tables_with_data }}"
          - "Top tabla: {{ top_table_name }} ({{ top_table_rows }} filas)"
          - "Esquema columnas: {{ schema_response.json.tables[0].rows | default([]) | length }}"
          - "Muestra de eventos: {{ sample_response.json.tables[0].rows | default([]) | length }}"
          - "Todas las tablas: {{ all_tables_summary }}"

    - name: Notificar via adaptive card en Teams
      ansible.builtin.uri:
        url: "{{ teams_webhook_url }}"
        method: POST
        validate_certs: no
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          type: message
          attachments:
            - contentType: "application/vnd.microsoft.card.adaptive"
              content:
                $schema: "http://adaptivecards.io/schemas/adaptive-card.json"
                type: AdaptiveCard
                version: "1.4"
                body:
                  - type: Container
                    style: "{{ 'good' if n_tables_with_data | int > 0 else 'warning' }}"
                    items:
                      - type: TextBlock
                        text: "📊 TALENTO Workspace Snapshot"
                        weight: Bolder
                        size: Large
                      - type: TextBlock
                        text: "Ejecutado por talento-triage-agent vía AWX"
                        isSubtle: true
                        spacing: None
                  - type: FactSet
                    facts:
                      - title: "Rango analizado"
                        value: "{{ time_range_hours }} horas"
                      - title: "Tablas con datos"
                        value: "{{ n_tables_with_data }}"
                      - title: "Tabla más activa"
                        value: "{{ top_table_name }}"
                      - title: "Filas en top tabla"
                        value: "{{ top_table_rows }}"
                      - title: "Columnas del schema"
                        value: "{{ schema_response.json.tables[0].rows | default([]) | length }}"
                      - title: "Muestra recuperada"
                        value: "{{ sample_response.json.tables[0].rows | default([]) | length }} eventos"
                  - type: TextBlock
                    text: "Resumen de tablas"
                    weight: Bolder
                    spacing: Medium
                  - type: TextBlock
                    text: "{% for t in all_tables_summary %}• **{{ t[0] }}**: {{ t[1] }} filas\n{% endfor %}"
                    wrap: true
        status_code: [200, 202]
        timeout: 15
      when: teams_webhook_url | length > 0
      register: teams_notification
      retries: 3
      delay: 3
      until: teams_notification.status | default(-1) in [200, 202]
      ignore_errors: true

    - name: Reportar resultado de la notificación Teams
      ansible.builtin.debug:
        msg: >-
          {% if teams_webhook_url | length == 0 %}
          Teams webhook no configurado — skip notificación.
          {% elif teams_notification.status | default(0) in [200, 202] %}
          ✓ Adaptive card enviada a Teams (HTTP {{ teams_notification.status }}).
          {% else %}
          ⚠ Fallo notificación Teams (status {{ teams_notification.status | default('?') }}).
          {% endif %}
