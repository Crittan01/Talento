---
# talento-full-health-check.yml
#
# DIAGNOSTICO (no invasivo) — orchestrator que ejecuta los 3 diagnosticos
# (ACI + App Service + SQL) en un solo run y produce un veredicto global.
#
# Util como "scenario panoramico" para el agente IA antes de cualquier
# decision de remediacion.
#
# Replica internamente la logica de los playbooks individuales
# (talento-aci-state.yml, talento-appservice-state.yml, talento-sql-health.yml)
# para no depender de import_playbook (que requiere AWX project structure).
#
# Set_stats consolidado:
#   overall_severity: HEALTHY/DEGRADED/CRITICAL (max de las 3)
#   aci_severity, appservice_severity, sql_severity
#   total_resources_count, recommendation

- name: TALENTO full health check — orchestrator de diagnostico
  hosts: localhost
  gather_facts: false

  vars:
    tenant_id: "{{ azure_tenant_id | default(lookup('env', 'AZURE_TENANT_ID')) }}"
    client_id: "{{ azure_client_id | default(lookup('env', 'AZURE_CLIENT_ID')) }}"
    client_secret: "{{ azure_client_secret | default(lookup('env', 'AZURE_CLIENT_SECRET')) }}"
    subscription_id: "{{ azure_subscription_id | default(lookup('env', 'AZURE_SUBSCRIPTION_ID')) }}"
    resource_group: "{{ azure_resource_group | mandatory }}"
    teams_webhook_url: "{{ teams_webhook_url | default(lookup('env', 'TEAMS_WEBHOOK_URL')) }}"

  tasks:
    - name: Obtener token OAuth2 (Azure ARM)
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ tenant_id }}/oauth2/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ client_id }}"
          client_secret: "{{ client_secret }}"
          resource: "https://management.azure.com/"
        status_code: 200
        timeout: 30
      register: token_response
      no_log: true

    - name: Guardar token
      ansible.builtin.set_fact:
        arm_token: "{{ token_response.json.access_token }}"
      no_log: true

    # ──────────────────────────────────────────────────────────────────
    # SECCION 1: Container Instances
    # ──────────────────────────────────────────────────────────────────
    - name: Listar Container Instances
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.ContainerInstance/containerGroups?api-version=2023-05-01"
        method: GET
        headers: { Authorization: "Bearer {{ arm_token }}" }
        status_code: 200
        timeout: 30
      register: aci_list

    - name: Detalle por container (instanceView)
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.ContainerInstance/containerGroups/{{ item.name }}?api-version=2023-05-01"
        method: GET
        headers: { Authorization: "Bearer {{ arm_token }}" }
        status_code: 200
        timeout: 30
      register: aci_detail_list
      loop: "{{ aci_list.json.value }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Procesar ACI
      ansible.builtin.set_fact:
        aci_summary: >-
          {{ aci_summary | default([]) + [{
            'name': item.json.name,
            'state': (item.json.properties.instanceView.state | default('Unknown')),
            'restartCount': (item.json.properties.containers | map(attribute='properties.instanceView.restartCount') | map('default', 0) | sum),
            'last_event_type': ((item.json.properties.instanceView.events | default([]) | last).type | default(None))
          }] }}
      loop: "{{ aci_detail_list.results }}"
      loop_control:
        label: "{{ item.json.name }}"

    - name: ACI severity
      ansible.builtin.set_fact:
        aci_severity: >-
          {{ 'CRITICAL' if (aci_summary | selectattr('state', 'in', ['Terminated', 'Failed']) | list | length > 0)
             else ('DEGRADED' if (aci_summary | selectattr('restartCount', 'gt', 3) | list | length > 0)
             else 'HEALTHY') }}

    # ──────────────────────────────────────────────────────────────────
    # SECCION 2: App Services
    # ──────────────────────────────────────────────────────────────────
    - name: Listar App Services
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.Web/sites?api-version=2023-12-01"
        method: GET
        headers: { Authorization: "Bearer {{ arm_token }}" }
        status_code: 200
        timeout: 30
      register: web_list

    - name: Procesar App Services
      ansible.builtin.set_fact:
        appservice_summary: >-
          {{ appservice_summary | default([]) + [{
            'name': item.name,
            'state': item.properties.state,
            'enabled': item.properties.enabled,
            'availabilityState': item.properties.availabilityState
          }] }}
      loop: "{{ web_list.json.value }}"
      loop_control:
        label: "{{ item.name }}"

    - name: App Service severity
      ansible.builtin.set_fact:
        appservice_severity: >-
          {{ 'CRITICAL' if (appservice_summary | default([]) | selectattr('state', 'in', ['Stopped', 'StoppedFunctions']) | list | length > 0)
             else ('DEGRADED' if (appservice_summary | default([]) | selectattr('availabilityState', 'ne', 'Normal') | list | length > 0)
             else 'HEALTHY') }}

    # ──────────────────────────────────────────────────────────────────
    # SECCION 3: SQL
    # ──────────────────────────────────────────────────────────────────
    - name: Listar SQL Servers
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.Sql/servers?api-version=2023-05-01-preview"
        method: GET
        headers: { Authorization: "Bearer {{ arm_token }}" }
        status_code: 200
        timeout: 30
      register: sql_list

    - name: Listar databases por server
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.Sql/servers/{{ item.name }}/databases?api-version=2023-05-01-preview"
        method: GET
        headers: { Authorization: "Bearer {{ arm_token }}" }
        status_code: 200
        timeout: 30
      register: sql_db_list
      loop: "{{ sql_list.json.value }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Procesar databases (excluye master)
      ansible.builtin.set_fact:
        sql_databases: >-
          {{ sql_databases | default([]) + [{
            'server': pair.0.item.name,
            'name': pair.1.name,
            'status': pair.1.properties.status,
            'tier': pair.1.properties.currentSku.tier | default('?')
          }] }}
      loop: "{{ sql_db_list.results | subelements('json.value', skip_missing=True) }}"
      loop_control:
        label: "{{ pair.0.item.name }}/{{ pair.1.name }}"
        loop_var: pair
      when: pair.1.name != 'master'

    - name: SQL severity
      ansible.builtin.set_fact:
        sql_severity: "{{ 'CRITICAL' if (sql_databases | default([]) | selectattr('status', 'ne', 'Online') | list | length > 0) else 'HEALTHY' }}"

    # ──────────────────────────────────────────────────────────────────
    # VEREDICTO GLOBAL
    # ──────────────────────────────────────────────────────────────────
    - name: Calcular overall_severity (max de las 3)
      ansible.builtin.set_fact:
        overall_severity: >-
          {{ 'CRITICAL' if 'CRITICAL' in [aci_severity, appservice_severity, sql_severity]
             else ('DEGRADED' if 'DEGRADED' in [aci_severity, appservice_severity, sql_severity]
             else 'HEALTHY') }}

    - name: Generar recomendacion para el agente
      ansible.builtin.set_fact:
        recommendation: >-
          {% if overall_severity == 'CRITICAL' %}
          Hay recursos en estado critico — revisar prioritariamente:
          {{ (aci_summary | selectattr('state', 'in', ['Terminated', 'Failed']) | map(attribute='name') | list)
             + (appservice_summary | default([]) | selectattr('state', 'in', ['Stopped', 'StoppedFunctions']) | map(attribute='name') | list)
             + (sql_databases | default([]) | selectattr('status', 'ne', 'Online') | map(attribute='name') | list) }}.
          Sugerencia: ejecutar talento-aci-restart o talento-appservice-restart segun el recurso afectado.
          {% elif overall_severity == 'DEGRADED' %}
          Hay degradacion pero sin crisis. Recomendado correr talento-errors-analysis para entender raiz antes de remediar.
          {% else %}
          Todos los recursos en estado saludable. No se requiere accion.
          {% endif %}

    - name: Exportar via set_stats
      ansible.builtin.set_stats:
        data:
          overall_severity: "{{ overall_severity }}"
          aci_severity: "{{ aci_severity }}"
          appservice_severity: "{{ appservice_severity }}"
          sql_severity: "{{ sql_severity }}"
          aci_summary: "{{ aci_summary }}"
          appservice_summary: "{{ appservice_summary | default([]) }}"
          sql_databases: "{{ sql_databases | default([]) }}"
          total_resources_count: "{{ (aci_summary | length) + (appservice_summary | default([]) | length) + (sql_databases | default([]) | length) }}"
          recommendation: "{{ recommendation | trim }}"
          resource_group: "{{ resource_group }}"
        per_host: false

    - name: Reporte stdout
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "  TALENTO — Full Health Check ({{ resource_group }})"
          - "════════════════════════════════════════════════════════"
          - "  ACI:         {{ aci_severity }} ({{ aci_summary | length }} containers)"
          - "  App Service: {{ appservice_severity }} ({{ appservice_summary | default([]) | length }} sites)"
          - "  SQL:         {{ sql_severity }} ({{ sql_databases | default([]) | length }} databases)"
          - ""
          - "  VEREDICTO GLOBAL: {{ overall_severity }}"
          - "  Recomendacion: {{ recommendation | trim }}"
