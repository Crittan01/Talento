---
# talento-sql-revoke-ddl.yml
#
# REMEDIACION (dolor 5 — creacion de objetos no autorizados en BD / control DDL).
# Cuando el agente detecta un DDL (CREATE/ALTER/DROP) que NO cae dentro de una
# ventana de cambio aprobada (lookup_changes no encontro CHG que lo cubra), este
# playbook contiene al login responsable revocando sus permisos DDL, como control
# preventivo SOX. NO ejecuta rollback destructivo del objeto por defecto.
#
# DRY-RUN (default): muestra el T-SQL que SE EJECUTARIA, sin tocar la BD.
# REAL (dry_run=false): ejecuta el DENY de permisos DDL — REQUIERE credencial SQL
#   dedicada (sql_admin_login/sql_admin_password) y conectividad a Azure SQL.
#   Sin credencial NO ejecuta aunque dry_run=false (seguro por defecto).
#
# Variables (inyectadas por el bridge/panel desde el incidente):
#   target_login    login responsable del DDL                (OBLIGATORIA)
#   ddl_object      objeto creado/alterado (contexto)         (recomendada)
#   chg_violado     CHG esperado / 'ninguno' (contexto)
#   sql_server_name / sql_db_name   destino
#   sql_admin_login / sql_admin_password   credencial dedicada (solo REAL)
#   dry_run         true (default)

- name: TALENTO SQL Revoke DDL — contencion de cambio no autorizado en BD
  hosts: localhost
  gather_facts: false

  vars:
    sql_server:   "{{ sql_server_name | default('sqlserver-ecopetrol2') }}"
    sql_db:       "{{ sql_db_name     | default('ecopetroldb2') }}"
    tgt_login:    "{{ target_login | default('') }}"
    ddl_obj:      "{{ ddl_object | default('(desconocido)') }}"
    chg_ref:      "{{ chg_violado | default('ninguno') }}"
    sa_login:     "{{ sql_admin_login    | default(lookup('env', 'SQL_ADMIN_LOGIN')) }}"
    sa_password:  "{{ sql_admin_password | default(lookup('env', 'SQL_ADMIN_PASSWORD')) }}"
    is_dry_run:   "{{ dry_run | default(true) | bool }}"
    teams_url:    "{{ teams_webhook_url | default(lookup('env', 'TEAMS_WEBHOOK_URL')) }}"
    sql_fqdn:     "{{ sql_server }}.database.windows.net"
    # Revoca capacidad de DDL al principal (preventivo, no destruye el objeto).
    tsql:         "DENY CREATE TABLE, ALTER ANY SCHEMA, ALTER TO [{{ tgt_login }}];"
    has_sql_cred: "{{ (sa_login | length > 0) and (sa_password | length > 0) }}"

  tasks:
    - name: Validar variable obligatoria target_login
      ansible.builtin.assert:
        that:
          - tgt_login | length > 0
        fail_msg: "Falta 'target_login' (responsable del DDL). El bridge lo inyecta desde el incidente."

    - name: "[DRY-RUN] Mostrar contencion DDL planificada"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "  🔍 DRY-RUN — NO se modifica la base de datos"
          - "════════════════════════════════════════════════════════"
          - "  SQL Server:  {{ sql_fqdn }}"
          - "  Database:    {{ sql_db }}"
          - "  Login responsable: {{ tgt_login }}"
          - "  Objeto DDL:  {{ ddl_obj }}"
          - "  CHG violado: {{ chg_ref }}  (sin ventana de cambio aprobada)"
          - ""
          - "  T-SQL PLANIFICADO: {{ tsql }}"
          - "  (reversible con GRANT; el objeto NO se elimina automaticamente)"
          - ""
          - "  Para ejecutar de verdad: dry_run=false + credencial SQL dedicada."
      when: is_dry_run

    - name: "[DRY-RUN] Publicar set_stats"
      ansible.builtin.set_stats:
        data:
          action_executed: false
          dry_run: true
          sql_server: "{{ sql_server }}"
          database: "{{ sql_db }}"
          target_login: "{{ tgt_login }}"
          ddl_object: "{{ ddl_obj }}"
          tsql_planned: "{{ tsql }}"
          message: "DRY-RUN: se revocarian permisos DDL a {{ tgt_login }} por cambio no autorizado en {{ ddl_obj }}."
      when: is_dry_run

    - name: "[REAL] Aviso — falta credencial SQL dedicada (no se ejecuta)"
      ansible.builtin.debug:
        msg: "dry_run=false pero NO hay sql_admin_login/password. Por seguridad NO se ejecuta. Provea la credencial SQL dedicada en AWX."
      when: not is_dry_run and not (has_sql_cred | bool)

    - name: "[REAL] Revocar permisos DDL via sqlcmd"
      ansible.builtin.shell: >-
        sqlcmd -S {{ sql_fqdn }} -d {{ sql_db }}
        -U {{ sa_login }} -P {{ sa_password }}
        -l 30 -b -Q "{{ tsql }}"
      register: sql_result
      no_log: true
      when: not is_dry_run and (has_sql_cred | bool)

    - name: "[REAL] Publicar set_stats"
      ansible.builtin.set_stats:
        data:
          action_executed: true
          dry_run: false
          sql_server: "{{ sql_server }}"
          database: "{{ sql_db }}"
          target_login: "{{ tgt_login }}"
          ddl_object: "{{ ddl_obj }}"
          tsql_executed: "{{ tsql }}"
          rc: "{{ sql_result.rc | default('?') }}"
          message: "REAL: revocados permisos DDL a {{ tgt_login }} (cambio no autorizado en {{ ddl_obj }})."
      when: not is_dry_run and (has_sql_cred | bool)

    - name: Notificar Teams
      ansible.builtin.uri:
        url: "{{ teams_url }}"
        method: POST
        body_format: json
        body:
          type: AdaptiveCard
          version: "1.4"
          body:
            - type: TextBlock
              text: >-
                {{ '🔍 DRY-RUN' if is_dry_run else '✅ EJECUTADO' }}
                — Contencion de DDL no autorizado {{ 'planificada' if is_dry_run else 'aplicada' }}
              weight: Bolder
              size: Medium
            - type: FactSet
              facts:
                - title: Login responsable
                  value: "{{ tgt_login }}"
                - title: Objeto DDL
                  value: "{{ ddl_obj }}"
                - title: Database
                  value: "{{ sql_db }}"
                - title: CHG
                  value: "{{ chg_ref }} (sin ventana aprobada)"
                - title: Accion
                  value: "DENY permisos DDL (reversible)"
                - title: Modo
                  value: "{{ 'DRY-RUN (no modificado)' if is_dry_run else 'REAL' }}"
        status_code: [200, 202]
        timeout: 15
        validate_certs: false
      when: teams_url | length > 0
      ignore_errors: true
