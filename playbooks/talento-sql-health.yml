---
# talento-sql-health.yml
#
# DIAGNOSTICO (no invasivo) — reporta estado de Azure SQL Server(s) y
# sus bases de datos en el RG.
#
# Para cada SQL Server:
#   - state, version, fullyQualifiedDomainName, location, administratorLogin
#   - lista de databases con: name, status, currentServiceObjectiveName (SKU),
#     maxSizeBytes, edition, currentSku.tier
#
# Set_stats:
#   sql_server_count, sql_servers (lista), sql_database_count,
#   sql_databases (lista), sql_severity (HEALTHY/DEGRADED/CRITICAL)

- name: TALENTO SQL health — diagnostico no invasivo
  hosts: localhost
  gather_facts: false

  vars:
    tenant_id: "{{ azure_tenant_id | default(lookup('env', 'AZURE_TENANT_ID')) }}"
    client_id: "{{ azure_client_id | default(lookup('env', 'AZURE_CLIENT_ID')) }}"
    client_secret: "{{ azure_client_secret | default(lookup('env', 'AZURE_CLIENT_SECRET')) }}"
    subscription_id: "{{ azure_subscription_id | default(lookup('env', 'AZURE_SUBSCRIPTION_ID')) }}"
    resource_group: "{{ azure_resource_group | default('rg-central-solucion-talento') }}"

  tasks:
    - name: Validar vars Azure
      ansible.builtin.assert:
        that:
          - tenant_id | length > 0
          - client_id | length > 0
          - client_secret | length > 0
          - subscription_id | length > 0
        fail_msg: "Faltan vars azure_*"

    - name: Obtener token OAuth2 (Azure ARM)
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ tenant_id }}/oauth2/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ client_id }}"
          client_secret: "{{ client_secret }}"
          resource: "https://management.azure.com/"
        status_code: 200
        timeout: 30
      register: token_response
      no_log: true

    - name: Guardar token
      ansible.builtin.set_fact:
        arm_token: "{{ token_response.json.access_token }}"
      no_log: true

    - name: Listar SQL Servers del RG
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.Sql/servers?api-version=2023-05-01-preview"
        method: GET
        headers:
          Authorization: "Bearer {{ arm_token }}"
        status_code: 200
        timeout: 30
      register: sql_server_list

    - name: Listar databases de cada SQL Server
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.Sql/servers/{{ item.name }}/databases?api-version=2023-05-01-preview"
        method: GET
        headers:
          Authorization: "Bearer {{ arm_token }}"
        status_code: 200
        timeout: 30
      register: sql_db_list
      loop: "{{ sql_server_list.json.value }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Procesar SQL Servers
      ansible.builtin.set_fact:
        sql_servers: >-
          {{ sql_servers | default([]) + [{
            'name': item.name,
            'fqdn': item.properties.fullyQualifiedDomainName,
            'state': item.properties.state | default('?'),
            'version': item.properties.version,
            'location': item.location,
            'administratorLogin': item.properties.administratorLogin
          }] }}
      loop: "{{ sql_server_list.json.value }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Procesar databases (excluye master)
      ansible.builtin.set_fact:
        sql_databases: >-
          {{ sql_databases | default([]) + [{
            'server': server_item.item.name,
            'name': db_item.name,
            'status': db_item.properties.status,
            'edition': db_item.properties.currentSku.name | default('?'),
            'tier': db_item.properties.currentSku.tier | default('?'),
            'currentServiceObjectiveName': db_item.properties.currentServiceObjectiveName | default('?'),
            'maxSizeGB': ((db_item.properties.maxSizeBytes | int) / 1073741824) | round(2),
            'collation': db_item.properties.collation | default('?'),
            'creationDate': db_item.properties.creationDate
          }] }}
      loop: "{{ sql_db_list.results | subelements('json.value', skip_missing=True) }}"
      loop_control:
        label: "{{ server_item.item.name }}/{{ db_item.name }}"
        loop_var: pair
      vars:
        server_item: "{{ pair.0 }}"
        db_item: "{{ pair.1 }}"
      when: db_item.name != 'master'

    - name: Clasificar severidad
      ansible.builtin.set_fact:
        not_online_dbs: "{{ sql_databases | default([]) | selectattr('status', 'ne', 'Online') | list }}"

    - name: Determinar sql_severity
      ansible.builtin.set_fact:
        sql_severity: "{{ 'CRITICAL' if not_online_dbs | length > 0 else 'HEALTHY' }}"

    - name: Exportar via set_stats
      ansible.builtin.set_stats:
        data:
          sql_server_count: "{{ sql_servers | default([]) | length }}"
          sql_servers: "{{ sql_servers | default([]) }}"
          sql_database_count: "{{ sql_databases | default([]) | length }}"
          sql_databases: "{{ sql_databases | default([]) }}"
          sql_severity: "{{ sql_severity }}"
          sql_not_online_count: "{{ not_online_dbs | length }}"
          resource_group: "{{ resource_group }}"
        per_host: false

    - name: Resumen stdout
      ansible.builtin.debug:
        msg:
          - "=== SQL HEALTH — {{ resource_group }} ==="
          - "Servers: {{ sql_servers | default([]) | length }} | Databases: {{ sql_databases | default([]) | length }}"
          - "Severidad: {{ sql_severity }}"
          - "Databases no-Online: {{ not_online_dbs | length }}"
          - "Servers detail:"
          - "{{ sql_servers | default([]) }}"
          - "Databases detail:"
          - "{{ sql_databases | default([]) }}"
